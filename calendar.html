<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Availability Calendar</title>
<style>
body { font-family: Arial; margin: 0; background: #f5f5f5; }
header { background: #333; color: #fff; padding: 20px; text-align: center; }
nav { background: #444; padding: 10px; text-align: center; }
nav a { color: #fff; margin: 0 15px; text-decoration: none; font-size: 18px; }
.container { width: 90%; max-width: 900px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { padding: 10px; background: #eaeaea; text-align: center; border-radius: 4px; cursor: pointer; }
.booked { background: #d9534f; color: #fff; }
.available { background: #5cb85c; color: #fff; }
</style>
</head>
<body>

<header>
<h1>Availability Calendar</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="calendar.html">Availability</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">
<h2>Select Dates</h2>
<p>Click any date to mark it as booked or available.</p>

<div id="calendar" class="calendar"></div>
</div>

<script>
const calendar = document.getElementById("calendar");

// Generate a 30‑day calendar (expandable)
for (let i = 1; i <= 30; i++) {
    const day = document.createElement("div");
    day.classList.add("day", "available");
    day.textContent = i;

    day.addEventListener("click", () => {
        day.classList.toggle("booked");
        day.classList.toggle("available");
    });

    calendar.appendChild(day);
}
</script>

</body>
</html>
