<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking Request</title>
<style>
body { font-family: Arial; margin: 0; background: #f5f5f5; }
header { background: #333; color: #fff; padding: 20px; text-align: center; }
nav { background: #444; padding: 10px; text-align: center; }
nav a { color: #fff; margin: 0 15px; text-decoration: none; font-size: 18px; }
.container { width: 90%; max-width: 900px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; }

form { display: grid; gap: 15px; }
label { font-weight: bold; }
input, textarea, select {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
button {
    padding: 12px;
    background: #5cb85c;
    color: #fff;
    border: none;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
}
button:hover { background: #4cae4c; }
</style>
</head>
<body>

<header>
<h1>Booking Request</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="calendar.html">Availability</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
<a href="booking.html">Booking Request</a>
</nav>

<div class="container">
<h2>Request a Stay</h2>
<p>Fill out the form below and we will contact you to confirm availability and pricing.</p>

<form action="mailto:youremail@example.com" method="POST" enctype="text/plain">

<label for="name">Full Name</label>
<input type="text" id="name" name="Name" required>

<label for="email">Email</label>
<input type="email" id="email" name="Email" required>

<label for="phone">Phone Number</label>
<input type="text" id="phone" name="Phone">

<label for="checkin">Check‑In Date</label>
<input type="date" id="checkin" name="Check‑In" required>

<label for="checkout">Check‑Out Date</label>
<input type="date" id="checkout" name="Check‑Out" required>

<label for="guests">Number of Guests</label>
<select id="guests" name="Guests">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5+</option>
</select>

<label for="message">Message</label>
<textarea id="message" name="Message" rows="5" placeholder="Tell us anything important about your stay..."></textarea>

<button type="submit">Submit Booking Request</button>

</form>
</div>

</body>
</html>
